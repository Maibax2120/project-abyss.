name: Build

on:
  push:
    branches:
      - project-abyss-dev
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Android + Desktop build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build desktop release JAR
        run: ./gradlew --no-daemon desktop:release

      - name: Assemble Android debug APK
        run: ./gradlew --no-daemon android:assembleDebug

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: project-abyss-builds
          path: |
            desktop/build/libs/*.jar
            android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
